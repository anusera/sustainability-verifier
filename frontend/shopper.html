<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product claims</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 480px; margin-inline: auto; color: #1a1a1a; line-height: 1.5; background: #fff; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; overflow-wrap: anywhere; }
  .card { border: 2px solid #444; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; background: #f6f6f6; }
  .claim { font-weight: 600; margin: 0 0 6px; overflow-wrap: anywhere; }
  .label { font-weight: 700; margin: 0 0 6px; }
  .summary, .date { margin: 0 0 6px; }
  .date { font-size: 0.9rem; color: #444; }
  .note { padding: 12px; border: 1px dashed #666; border-radius: 8px; }
  footer { margin-top: 24px; font-size: 0.9rem; color: #444; }
</style>
</head>
<body>
<h1 id="name">Product claims</h1>
<div id="content" aria-live="polite">Loading...</div>
<footer>This page supports, but does not replace, claims printed on pack.</footer>
<script>
(function () {
  var id = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  var content = document.getElementById("content");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    e.textContent = text;
    return e;
  }
  function note(text) {
    content.textContent = "";
    content.appendChild(el("p", "note", text));
  }

  fetch("/api/public/" + encodeURIComponent(id)).then(function (r) {
    if (r.status === 404) { note("Not yet verified. Check back soon."); return null; }
    if (!r.ok) throw new Error("bad status");
    return r.json();
  }).then(function (data) {
    if (!data) return;
    document.getElementById("name").textContent = data.product_name;
    document.title = data.product_name;
    content.textContent = "";
    data.claims.forEach(function (c) {
      var card = el("section", "card", "");
      card.appendChild(el("p", "claim", c.claim_text));
      card.appendChild(el("p", "label", c.status_label));
      card.appendChild(el("p", "summary", c.summary));
      card.appendChild(el("p", "date", "Last verified " + c.last_verified));
      content.appendChild(card);
    });
  }).catch(function () { note("Could not load this page. Please try again later."); });
})();
</script>
</body>
</html>
