<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Architecture of the sustainability claim verifier</title>
<desc>Documents flow through Claude extraction, code validation, rules and verdict, Claude explanation and a second validation, then reach the retailer, regulator and shopper pages. Every step is recorded in a hash-chained audit log.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="448" fill="#FFFFFF"/>

<rect x="40" y="30" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Documents</text>
<text x="125" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Hashed on intake</text>

<rect x="255" y="30" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="340" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">Extraction</text>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Claude: facts, quotes</text>

<rect x="470" y="30" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="555" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Fact validation</text>
<text x="555" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Quotes, tiers, dates</text>

<line x1="210" y1="58" x2="253" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="425" y1="58" x2="468" y2="58" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="86" x2="555" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="470" y="130" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="555" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Rules and verdict</text>
<text x="555" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Code decides</text>

<rect x="255" y="130" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">Explanation</text>
<text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Claude: plain English</text>

<rect x="40" y="130" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="125" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Reason validation</text>
<text x="125" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Facts, numbers, label</text>

<line x1="470" y1="158" x2="427" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="255" y1="158" x2="212" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="125" y1="186" x2="125" y2="214" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="125" y1="214" x2="555" y2="214" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="125" y1="214" x2="125" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="214" x2="340" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="214" x2="555" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="125" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Retailer dashboard</text>
<text x="125" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Run, review, reasons</text>

<rect x="255" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Regulator page</text>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Evidence and integrity</text>

<rect x="470" y="240" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="555" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Shopper page</text>
<text x="555" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Status only, public</text>

<line x1="340" y1="296" x2="340" y2="328" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>

<rect x="40" y="330" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Audit log</text>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Every step and document hashed</text>

<rect x="40" y="410" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="62" y="417" dominant-baseline="central" font-size="12" fill="#444441">Claude reads and explains</text>
<rect x="250" y="410" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="272" y="417" dominant-baseline="central" font-size="12" fill="#444441">Code decides and checks</text>
<rect x="460" y="410" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="482" y="417" dominant-baseline="central" font-size="12" fill="#444441">Documents and pages</text>
